[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "praxis"
version = "0.1.0.dev0"
description = "Experimental local scientific methodology catalog and executor"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["argdigest>=0.15,<0.16", "depdigest>=0.13,<0.14", "smonitor>=0.19,<0.20", "pyunitwizard>=0.28.1,<0.29"]

[project.optional-dependencies]
recording = ["recorda>=0.3,<0.4"]
attribution = ["ackredit>=0.12,<0.13"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
praxis = ["data/**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "examples"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
