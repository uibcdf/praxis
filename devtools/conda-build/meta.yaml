# Candidate recipe. Qualification builds do not publish this package.
package:
  name: praxis
  version: 0.1.0
source:
  path: ../..
build:
  number: 0
  string: py_0
  noarch: python
  script: "{{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv"
requirements:
  host:
    - python >=3.11,<3.15
    - pip
    - setuptools >=77
    - wheel
  run:
    - python >=3.11,<3.15
    - argdigest >=0.15,<0.16
    - depdigest >=0.13,<0.14
    - smonitor >=0.19,<0.20
    - pyunitwizard >=0.28.1,<0.29
test:
  imports:
    - praxis
    - praxis.benchmarks
    - praxis.replay
  commands:
    - python -c "import praxis, tempfile; assert praxis.__version__ == '0.1.0'; c = praxis.Catalog(tempfile.mkdtemp()); c.load_bundled(version='2')"
about:
  home: https://github.com/uibcdf/praxis
  license: MIT
  license_file: LICENSE
  summary: Experimental scientific methodology catalog, execution and audit
