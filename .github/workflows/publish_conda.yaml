name: Publish exact qualified Conda file

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full source SHA with all candidate gates passing
        required: true
        type: string
      candidate_run_id:
        description: Successful Python tests producer run for that exact SHA
        required: true
        type: string
      version:
        description: Qualified X.Y.Z package version and public tag when publishing
        required: true
        default: '0.1.0'
        type: string
      publish:
        description: Upload once after tag and credential checks; false only checks readiness
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: praxis-conda-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PRAXIS_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      PRAXIS_CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      PRAXIS_RELEASE_VERSION: ${{ inputs.version }}
      PRAXIS_PUBLISH: ${{ inputs.publish }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Require exact source, version, tag when writing and complete passing CI
        id: gates
        run: |
          mkdir -p dist
          python -B devtools/release_route.py gates --receipt dist/candidate-gates.json
      - name: Download the original producer artifact without rebuilding
        env:
          ARTIFACT_NAME: ${{ steps.gates.outputs.artifact_name }}
        run: gh run download "$PRAXIS_CANDIDATE_RUN_ID" --repo uibcdf/praxis --name "$ARTIFACT_NAME" --dir dist/candidate
      - name: Inspect archives independently
        run: python -B devtools/check_artifacts.py dist/candidate/praxis-0.1.0-py3-none-any.whl dist/candidate/praxis-0.1.0.tar.gz --conda dist/candidate/praxis-0.1.0-py_0.tar.bz2
      - name: Refuse any occupied all-label coordinate
        id: preflight
        env:
          PRAXIS_UPLOAD_CREDENTIAL_PRESENT: ${{ secrets.ANACONDA_UIBCDF_TOKEN != '' && 'present' || '' }}
        run: python -B devtools/release_route.py preflight --receipt dist/registry-preflight.json
      - name: Install the exact-file write client
        if: inputs.publish
        run: python -m pip install anaconda-client==1.15.0
      - name: Upload the single digest-bound tested file
        id: upload
        if: inputs.publish
        uses: uibcdf/action-build-and-upload-conda-packages/upload@87c70b1443d5f22d738ee3ddf812bdbe0152f6c2
        with:
          artifact: ${{ steps.preflight.outputs.artifact }}
          package-spec: ${{ steps.preflight.outputs.package_spec }}
          expected-sha256: ${{ steps.preflight.outputs.sha256 }}
          candidate-sha: ${{ inputs.candidate_sha }}
          label: main
          token: ${{ secrets.ANACONDA_UIBCDF_TOKEN }}
      - name: Independently observe the exact public coordinate and bytes
        if: always() && inputs.publish && steps.upload.outcome != 'skipped' && steps.preflight.outcome == 'success'
        run: python -B devtools/release_route.py verify-public --receipt dist/registry-public.json
      - name: Retain qualification or publication observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conda-route-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/candidate-gates.json
            dist/registry-*.json
            ${{ steps.upload.outputs.receipt }}
          if-no-files-found: warn
