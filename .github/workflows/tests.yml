name: Python tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * 1'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install ruff==0.16.5 pyyaml packaging
      - run: python -B devtools/check_dependencies.py
      - run: python -B devtools/moli_governance.py
      - run: ruff check .
      - run: ruff format --check .
  candidate:
    needs: quality
    uses: ./.github/workflows/build_and_upload_conda_packages.yaml
  tests:
    needs: candidate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
        exclude:
          - os: ubuntu-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    steps: &installed_steps
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.candidate.outputs.artifact_name }}
          path: candidate
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: devtools/conda-envs/test_env.yaml
          create-args: python=${{ matrix.python }} --strict-channel-priority
      - name: Install the exact shared Conda artifact
        run: micromamba install --yes --no-deps candidate/praxis-0.1.1-py_0.tar.bz2
      - run: python -m pip check
      - name: Check architecture and installed resources/dependencies
        env:
          EXPECTED_OS: ${{ matrix.os }}
        run: |
          python -c "import os, platform; assert os.environ['EXPECTED_OS'] != 'macos-latest' or platform.machine() == 'arm64'"
          python -B devtools/check_installed.py candidate/artifacts.json candidate/praxis-0.1.1-py_0.tar.bz2 installed-conda.json
          micromamba list --json > conda-closure.json
      - name: Test installed package with published optional providers
        run: python -B -m pytest --receptor=ci -o pythonpath=examples --junitxml=installed-conda-tests.xml --cov=praxis --cov-report=xml:coverage.xml
      - name: Qualify the retained wheel on routine Linux Python
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        run: |
          python -m pip install --no-deps --force-reinstall candidate/praxis-0.1.1-py3-none-any.whl
          python -B devtools/check_installed.py candidate/artifacts.json candidate/praxis-0.1.1-py3-none-any.whl installed-wheel.json
          python -B -m pytest --receptor=ci -o pythonpath=examples --junitxml=installed-wheel-tests.xml
      - name: Retain observed candidate and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-${{ matrix.os }}-py${{ matrix.python }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            installed-*.json
            installed-*-tests.xml
            conda-closure.json
            coverage.xml
          if-no-files-found: warn
  routine_linux:
    name: tests (${{ matrix.os }}, ${{ matrix.python }})
    needs: candidate
    strategy:
      matrix:
        os: [ubuntu-latest]
        python: ['3.14']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    steps: *installed_steps
  coverage:
    name: Publish measured default-branch coverage
    needs: [candidate, routine_linux]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v4
        with:
          name: installed-ubuntu-latest-py3.14-${{ github.run_id }}-${{ github.run_attempt }}
          path: measured
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.candidate.outputs.artifact_name }}
          path: candidate
      - name: Map identical installed sources to repository paths
        run: python -B devtools/normalize_coverage.py measured/coverage.xml measured/installed-conda.json candidate/artifacts.json coverage-codecov.xml > coverage-mapping.json
      - name: Upload complete routine Linux report
        # Same reviewed OIDC-capable v7.1.1 used by MOLI; no repository token needed.
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          use_oidc: true
          files: coverage-codecov.xml
          disable_search: true
          fail_ci_if_error: true
      - name: Retain coverage mapping evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-mapping-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage-codecov.xml
            coverage-mapping.json
          if-no-files-found: error

  latest_support:
    name: Latest public support (${{ matrix.os }}, ${{ matrix.python }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request') && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
        python: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request') && '["3.11", "3.12", "3.13", "3.14"]' || '["3.14"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: devtools/conda-envs/latest_support_env.yaml
          create-args: python=${{ matrix.python }} --strict-channel-priority
      - name: Install current consumer without replacing public providers
        run: python -m pip install --no-deps --no-build-isolation .
      - name: Verify latest public provider versions and installed origins
        env:
          EXPECTED_OS: ${{ matrix.os }}
        run: |
          python - <<'PYCODE'
          import importlib, json, os, platform, sys
          from importlib.metadata import version
          from pathlib import Path
          assert os.environ['EXPECTED_OS'] != 'macos-latest' or platform.machine() == 'arm64'
          expected = {'argdigest': ('0.17.0', 'py_0', '9c35fa297b5a85dc65ac49ccd108f60f08dbeac4f745d6c369a767c0a0b3a3e1'), 'smonitor': ('0.22.0', 'py_0', 'bbf5890bed4ea657044b904f07d3cef137d474f0862ef5f35b063db9c8f0c949'), 'depdigest': ('0.15.1', 'py_0', '2765c692de4e6aacff4197c4226ebb42ec1f0df9edb27e92f196ef1390cb1850'), 'pyunitwizard': ('0.29.0', 'py_0', '9169cd302dbda415ebc441ef6f5077dcde834d435626fcf80c179a9013657f34'), 'recorda': ('0.3.3', 'py_0', 'fcee216130bca444e92e195fc38f8ef24fb501439cd123638bc11fa8e5df76ea')}
          records = {}
          prefix = Path(sys.prefix).resolve()
          for name, (release, build, digest) in expected.items():
              assert version(name) == release
              assert Path(importlib.import_module(name).__file__).resolve().is_relative_to(prefix)
              candidates = list((prefix / 'conda-meta').glob(f'{name}-*.json'))
              assert len(candidates) == 1
              record = json.loads(candidates[0].read_text())
              assert record['fn'] == f'{name}-{release}-{build}.tar.bz2'
              assert record['sha256'] == digest
              assert record['url'] == f'https://conda.anaconda.org/uibcdf/noarch/{record["fn"]}'
              records[name] = {key: record[key] for key in ('name', 'version', 'build', 'sha256', 'url')}
          Path('latest-support-providers.json').write_text(json.dumps(records, indent=2) + '\n')
          PYCODE
          python -m pip check
      - name: Test installed consumer with latest mandatory providers
        # Public Recorda 0.3.3 admits this cohort; its integration tests must execute.
        # The installed candidate lanes retain the separately qualified legacy cohort.
        run: python -B -m pytest --receptor=ci -o pythonpath=examples --junitxml=latest-support-tests.xml
      - name: Retain latest-provider receiving scope and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latest-support-${{ matrix.os }}-py${{ matrix.python }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            latest-support-providers.json
            latest-support-tests.xml
          if-no-files-found: error
